<div class="flex flex-col items-center justify-center w-full h-screen bg-gray-100">
  <div class="w-full max-w-md p-6 bg-white rounded-lg shadow-md">
    <h2 class="mb-6 text-2xl font-bold text-center">Editar Usuario</h2>
    <form (ngSubmit)="onSubmit()" #editUserForm="ngForm">
      <!-- Nombre -->
      <div class="mb-4">
        <label for="firstName" class="block mb-2 text-sm font-medium text-gray-700">Nombre</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          [(ngModel)]="firstName"
          #firstNameField="ngModel"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-500"
          placeholder="Ingresa el nombre"
        />
        <div *ngIf="firstNameField.invalid && firstNameField.touched" class="text-sm text-red-500">
          <span *ngIf="firstNameField.errors?.['required']">El nombre es obligatorio.</span>
        </div>
      </div>

      <!-- Apellido -->
      <div class="mb-4">
        <label for="lastName" class="block mb-2 text-sm font-medium text-gray-700">Apellido</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          [(ngModel)]="lastName"
          #lastNameField="ngModel"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-500"
          placeholder="Ingresa el apellido"
        />
        <div *ngIf="lastNameField.invalid && lastNameField.touched" class="text-sm text-red-500">
          <span *ngIf="lastNameField.errors?.['required']">El apellido es obligatorio.</span>
        </div>
      </div>

      <!-- Correo Electrónico -->
      <div class="mb-4">
        <label for="email" class="block mb-2 text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          #emailField="ngModel"
          required
          email
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-500"
          placeholder="Ingresa el correo electrónico"
        />
        <div *ngIf="emailField.invalid && emailField.touched" class="text-sm text-red-500">
          <span *ngIf="emailField.errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="emailField.errors?.['email']">El formato del correo no es válido.</span>
        </div>
      </div>

      <!-- Estado -->
      <div class="mb-4">
        <label for="status" class="block mb-2 text-sm font-medium text-gray-700">Estado</label>
        <select
          id="status"
          name="status"
          [(ngModel)]="status"
          #statusField="ngModel"
          required
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-500"
        >
          <option [value]="true">Activo</option>
          <option [value]="false">Inactivo</option>
        </select>
        <div *ngIf="statusField.invalid && statusField.touched" class="text-sm text-red-500">
          <span *ngIf="statusField.errors?.['required']">El estado es obligatorio.</span>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="mb-6">
        <label for="password" class="block mb-2 text-sm font-medium text-gray-700">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          #passwordField="ngModel"
          minlength="6"
          class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-500"
          placeholder="Ingresa la nueva contraseña"
        />
        <div *ngIf="passwordField.invalid && passwordField.touched" class="text-sm text-red-500">
          <span *ngIf="passwordField.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</span>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-between">
        <button
          type="button"
          (click)="goBack()"
          class="px-4 py-2 font-bold text-gray-700 bg-gray-200 rounded hover:bg-gray-300 focus:outline-none focus:ring focus:ring-gray-300"
        >
          Volver
        </button>
        <button
          type="submit"
          [disabled]="editUserForm.invalid"
          class="px-4 py-2 font-bold text-white bg-blue-500 rounded hover:bg-blue-600 focus:outline-none focus:ring focus:ring-blue-300"
        >
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
